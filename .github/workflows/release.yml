name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Read version
        id: version
        run: |
          VERSION=$(grep "^mod_version=" gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find JAR
        id: jar
        run: |
          FILE=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n1)
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists."
            exit 0
          fi

          git config user.name github-actions
          git config user.email github-actions@github.com

          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: ${{ steps.jar.outputs.file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        uses: modrinth/action/publish@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project_id: YOUR_PROJECT_ID
          version_number: ${{ steps.version.outputs.version }}
          version_name: v${{ steps.version.outputs.version }}
          version_type: release
          game_versions: |
            1.21.11
          loaders: |
            fabric
          files: ${{ steps.jar.outputs.file }}
