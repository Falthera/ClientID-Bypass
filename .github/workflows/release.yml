name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Bump Version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION/" gradle.properties
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gradle.properties
          git commit -m "Bump version to $NEW_VERSION [skip ci]"
          git push origin main

      - name: Read Version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check and Create Tag
        id: tag
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            git tag "v${{ steps.version.outputs.version }}"
            git push origin "v${{ steps.version.outputs.version }}"
          fi

      - name: Build
        run: ./gradlew build

      - name: Find JAR File
        id: jar
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -n1)
          echo "jar=${JAR_FILE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: ${{ steps.jar.outputs.jar }}
          draft: false
          prerelease: false

      - name: Publish to Modrinth
        if: steps.tag.outputs.tag_exists == 'false'
        uses: matatonic/modrinth-release-action@v1
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          file: ${{ steps.jar.outputs.jar }}
          version_number: ${{ steps.version.outputs.version }}
          version_name: Release ${{ steps.version.outputs.version }}
