name: Release

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Find JAR
        id: find-jar
        run: |
          JAR_PATH=$(find ./build/libs -name "*.jar" -not -name "*-sources.jar" -not -name "*-sources.jar" | head -n 1)
          echo "jar-path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ steps.find-jar.outputs.jar-path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(release): bump version') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: ./build/libs

      - name: Read Version
        id: version
        run: |
          VERSION=$(grep -oP 'mod_version=\K.*' gradle.properties)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Tag
        id: create-tag
        run: |
          NEW_TAG="v${{ steps.version.outputs.version }}"
          git config --local user.email "action@kilo.ai"
          git config --local user.name "Kilo Action"
          git tag $NEW_TAG
          git push origin $NEW_TAG
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            See changelog for details.
          files: ./build/libs/*.jar
          draft: false
          prerelease: false

      - name: Publish to Modrinth
        uses: modrinth/action/publish@v1
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          file: ./build/libs/*.jar
          version_number: ${{ steps.version.outputs.version }}
          version_title: ${{ steps.version.outputs.version }}
          loaders:
            - fabric
          game_versions:
            - 1.21.11
          description: ClientID Bypass mod release
          project_type: mod