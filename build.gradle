plugins {
	id 'fabric-loom' version '1.14'
	id 'maven-publish'
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_name
}

repositories {
	mavenCentral()
	maven {
		url = uri("https://maven.fabricmc.net/")
		name = "Fabric"
	}
	maven {
		url = uri("https://maven.minecraft.net/maven2/")
		name = "Mojang"
	}
	maven {
		url = uri("https://api.modrinth.com/maven")
		name = "Modrinth"
	}
}

def minecraft_version = "1.21.11"
def yarn_mappings = "1.21.11+build.1"
def loader_version = project.fabric_loader_version

dependencies {
	minecraft "net.minecraft:minecraft:${minecraft_version}"
	mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "minecraft_version": minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}